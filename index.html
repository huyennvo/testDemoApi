<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#323233">
<title>VSAF — Thực hành cùng diễn giả</title>
<style>
/* ============ Biến màu (giao diện tối kiểu IDE) ============ */
:root{
  color-scheme: dark;
  --bg:#1e1e1e; --bg-panel:#252526; --bg-raise:#2d2d30; --bg-hover:#2a2d2e; --bg-sel:#37373d;
  --bg-input:#313131; --bg-term:#181818; --bg-title:#323233;
  --line:#3c3c3c; --line-soft:#2e2e2e;
  --fg:#d4d4d4; --fg-dim:#a0a0a0; --fg-strong:#ffffff;
  --accent:#3794ff; --btn:#0e639c; --btn-hover:#1177bb; --btn-fg:#ffffff; --status:#007acc; --status-fg:#ffffff;
  --ok:#89d185; --warn:#e5c07b; --err:#f48771; --info:#75beff;
  --claude:#e0b15c; --claude-bg:#2f2a20; --claude-line:#6b5a35;
  --new:#4fc1ff; --new-bg:rgba(55,148,255,.24);
  --syn-kw:#569cd6; --syn-str:#ce9178; --syn-cmt:#7ca668; --syn-num:#b5cea8; --syn-fn:#dcdcaa; --syn-type:#4ec9b0; --syn-tag:#c586c0; --syn-head:#4fc1ff;
  --font-ui:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --font-mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
  --fs:16px; --fs-code:16px; --row-h:44px; --btn-h:48px;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  padding-left:env(safe-area-inset-left,0px);
  padding-right:env(safe-area-inset-right,0px);
}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg)}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font:var(--fs)/1.5 var(--font-ui);overflow:hidden;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
[hidden]{display:none !important}
button{font:inherit;color:inherit;cursor:pointer}
input,textarea{font:inherit;color:inherit}
.ic{width:20px;height:20px;flex:none;fill:currentColor;display:inline-block;vertical-align:middle}
:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
::selection{background:#264f78}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ============ Khung chính ============ */
#app{height:100%;display:flex;flex-direction:column;min-height:0;position:relative}
#app.kb{height:var(--vvh,100%)}
#topbar{flex:none;height:48px;display:flex;align-items:center;background:var(--bg-title);border-bottom:1px solid #000}
#logoBtn{width:56px;height:48px;border:0;background:transparent;display:flex;align-items:center;justify-content:center;padding:0}
#logoBtn .ic{width:28px;height:28px;color:#3c9cf0}
#projTitle{flex:1;min-width:0;text-align:center;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#spkBadge{min-width:56px;height:48px;border:0;background:transparent;color:var(--warn);font-weight:600;padding:0 10px;display:none}
#app.speaker #spkBadge{display:block}

#task{flex:none;background:var(--bg-panel);border-bottom:1px solid var(--line);padding:8px 12px 10px}
#segs{display:flex;gap:4px;margin-bottom:8px}
#segs i{flex:1;height:4px;border-radius:2px;background:#3d3d3d}
#segs i.done{background:var(--ok)}
#segs i.cur{background:var(--accent)}
#taskRow{display:flex;align-items:center;gap:10px}
#taskText{flex:1;min-width:0;line-height:1.35}
#taskBtn{flex:none}

#main{flex:1;min-height:0;display:flex;flex-direction:column;position:relative}
#rightCol{display:contents}
#rtabs{display:none}
.pane{display:none;flex:1;min-height:0;min-width:0;flex-direction:column;background:var(--bg)}
#paneProject{display:flex}
#app.tab-term #paneTerm,#app.tab-claude #paneClaude{display:flex}
#paneTerm,#paneClaude{position:absolute;left:0;right:0;bottom:0;top:var(--split,42%);z-index:20;border-top:2px solid var(--accent);box-shadow:0 -6px 16px rgba(0,0,0,.45)}
#app.pmax #paneTerm,#app.pmax #paneClaude,#app.kb #paneTerm,#app.kb #paneClaude{top:0}
#paneEditor{display:none}

#status{flex:none;background:var(--status);color:var(--status-fg);display:flex;flex-wrap:wrap;justify-content:space-between;gap:0 12px;padding:4px 12px;line-height:1.3}
#status span:last-child{opacity:.92}
#tabs{flex:none;display:flex;background:var(--bg-panel);border-top:1px solid var(--line)}
.tab{flex:1;min-height:60px;border:0;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--fg-dim);position:relative;padding:4px 2px}
.tab .ic{width:24px;height:24px}
.tab.active{color:var(--fg-strong);box-shadow:inset 0 3px 0 var(--accent);background:var(--bg)}
.tab .dotmark{position:absolute;top:8px;left:calc(50% + 10px);width:10px;height:10px;border-radius:50%;background:var(--new);display:none}
.tab.dot .dotmark{display:block}
.tab.pulse:not(.active){animation:pulse 1.7s ease-in-out infinite;color:var(--fg-strong)}
@keyframes pulse{0%,100%{background:transparent;box-shadow:inset 0 0 0 0 var(--new)}50%{background:var(--new-bg);box-shadow:inset 0 0 0 2px var(--new)}}

#app:not(.ide) #main{display:none}
#app.kb #status,#app.kb #task{display:none}

/* ============ Nút ============ */
.btn{min-height:var(--btn-h);padding:0 18px;border:0;border-radius:6px;background:var(--btn);color:var(--btn-fg);font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:8px;white-space:nowrap}
.btn:hover{background:var(--btn-hover)}
.btn:active{transform:translateY(1px)}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--fg)}
.btn.ghost:hover{background:var(--bg-hover)}
.btn.big{min-height:60px;font-size:19px;padding:0 28px;border-radius:8px}
.btn.warn{background:#7a3b32}
.btn[disabled]{opacity:.5;cursor:default}
.chipbtn{min-height:44px;padding:0 14px;border-radius:22px;border:1px solid var(--claude-line);background:var(--claude-bg);color:var(--claude);font-weight:600;display:inline-flex;align-items:center;gap:6px}
.chipbtn:active{transform:translateY(1px)}

/* ============ Màn hình khởi động (VSAF) ============ */
#launcher{flex:1;min-height:0;background:var(--bg);display:none;flex-direction:column;align-items:center;justify-content:center;padding:20px 20px 28px;text-align:center;gap:18px;overflow:auto}
#app:not(.ide) #launcher{display:flex}
#launcher .mark{width:84px;height:84px;color:#3c9cf0}
#launcher h1{margin:0;font-size:28px;font-weight:700;letter-spacing:.2px}
#launcher p{margin:0;color:var(--fg-dim);max-width:34ch}
#launcher .cmd{font-family:var(--font-mono);font-size:16px;background:var(--bg-term);border:1px solid var(--line);border-radius:6px;padding:8px 12px;word-break:break-all;color:var(--fg);max-width:100%}
.prog{width:min(420px,100%);height:10px;border-radius:5px;background:#333;overflow:hidden}
.prog i{display:block;height:100%;width:0;background:var(--accent);transition:width .25s linear}
.logbox{width:min(480px,100%);text-align:left;font-family:var(--font-mono);font-size:16px;background:var(--bg-term);border:1px solid var(--line);border-radius:6px;padding:8px 12px;min-height:5.2em;white-space:pre-wrap;word-break:break-word;color:var(--fg-dim)}
.success{display:flex;align-items:center;gap:10px;color:var(--ok);font-weight:700;font-size:19px}
.success .ic{width:28px;height:28px}
.ideicon{width:34px;height:34px;color:#fff}

/* ============ Cây thư mục ============ */
.panehead{flex:none;padding:8px 12px;color:var(--fg-dim);font-weight:600;border-bottom:1px solid var(--line-soft);display:flex;align-items:center;justify-content:space-between;gap:8px}
#cta{flex:none;padding:12px;border-bottom:1px solid var(--line-soft);display:none}
#cta.on{display:block}
#cta .btn{width:100%}
#tree{flex:1;min-height:0;overflow:auto;padding:4px 0 24px}
.trow{display:flex;align-items:center;gap:6px;min-height:var(--row-h);padding-right:10px;cursor:pointer;user-select:none;-webkit-user-select:none;position:relative}
.trow:hover{background:var(--bg-hover)}
.trow.sel{background:var(--bg-sel)}
.trow .chev{width:16px;height:16px;color:var(--fg-dim);transition:transform .12s}
.trow.open .chev{transform:rotate(90deg)}
.trow .chev.none{visibility:hidden}
.trow .ic{width:20px;height:20px}
.trow .name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.trow .note{color:var(--fg-dim);font-size:.9em;flex:none}
.pill{flex:none;font-size:14px;line-height:1;padding:4px 8px;border-radius:10px;background:var(--new);color:#00263d;font-weight:700}
.trow.is-new{animation:flash 3.2s linear both}
.trow.is-new .name{color:var(--fg-strong)}
@keyframes flash{0%,35%,70%{background:var(--new-bg)}17%,52%,87%,100%{background:transparent}}
.ic-folder{color:#dcb67a}.ic-ts{color:#4a9eed}.ic-md{color:#6cb6e0}.ic-json{color:#e0cf5b}.ic-feature{color:#89d185}.ic-py{color:#5f9fd6}.ic-env{color:#e5c07b}.ic-html{color:#e8744f}.ic-yaml{color:#c586c0}.ic-file{color:#a8a8a8}

/* ============ Chip file ở thư mục gốc ============ */
.chipbar{flex:none;display:flex;gap:8px;overflow-x:auto;padding:8px 10px;border-bottom:1px solid var(--line-soft);background:var(--bg-panel);scrollbar-width:none}
.chipbar::-webkit-scrollbar{display:none}
.chip{flex:none;min-height:44px;display:inline-flex;align-items:center;gap:6px;padding:0 12px;border:1px solid var(--line);background:var(--bg-raise);border-radius:8px;white-space:nowrap}
.chip.is-new{animation:flash 3.2s linear both}
.chip .ic{width:18px;height:18px}

/* ============ Terminal ============ */
.outwrap{flex:1;min-height:0;position:relative;display:flex;flex-direction:column}
.scroller{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain}
#termOut{padding:10px 12px;font:var(--fs-code)/1.45 var(--font-mono);background:var(--bg-term)}
.tl{white-space:pre-wrap;word-break:break-word;min-height:1.45em}
.tl .prompt{color:var(--ok)}
.tl.err{color:var(--err)}
.tl.hint{color:var(--warn)}
.tl .t-vsaf{color:var(--info)}
.tl .t-auto{color:#4ec9b0}
.tl.dim{color:var(--fg-dim)}
.tl.rule{color:#5a5a5a}
.welcome{margin:8px 0;border:1px solid var(--claude-line);border-radius:8px;padding:10px 14px;background:var(--claude-bg);color:var(--claude);white-space:pre-wrap;word-break:break-word}
.spinrow{display:flex;align-items:center;gap:10px;color:var(--fg-dim);min-height:1.45em}
.spin{width:16px;height:16px;border-radius:50%;border:2px solid #555;border-top-color:var(--accent);animation:spin .8s linear infinite;flex:none;display:inline-block}
@keyframes spin{to{transform:rotate(360deg)}}
.inrow{flex:none;display:flex;align-items:center;gap:8px;padding:6px 8px 6px 12px;border-top:1px solid var(--line);background:var(--bg-term)}
.inrow .prompt{font-family:var(--font-mono);color:var(--ok);white-space:nowrap}
.inrow input{flex:1;min-width:0;height:48px;background:transparent;border:0;outline:0;font-family:var(--font-mono);font-size:16px;color:var(--fg-strong)}
.hintrow{flex:none;display:none;gap:8px;padding:8px 10px 0;flex-wrap:wrap;background:var(--bg-term)}
.hintrow.on{display:flex}
.ffbtn{position:absolute;right:12px;bottom:10px;z-index:3;display:none;min-height:44px;padding:0 16px;border-radius:22px;border:1px solid var(--line);background:#3a3a3d;color:var(--fg-strong);font-weight:600;box-shadow:0 2px 10px rgba(0,0,0,.5);align-items:center;gap:8px}
.playing .ffbtn{display:inline-flex}

/* ============ Claude ============ */
#chat{padding:12px 12px 20px}
.empty{color:var(--fg-dim);padding:16px 4px}
.msg-user{display:flex;gap:10px;margin:14px 0 10px;padding:10px 12px;border-radius:8px;background:var(--bg-raise);border-left:3px solid var(--claude);word-break:break-word;white-space:pre-wrap}
.msg-user .gt{color:var(--claude);font-weight:700;font-family:var(--font-mono)}
.msg-c{display:flex;gap:10px;margin:10px 0}
.msg-c .bul{color:var(--claude);flex:none;line-height:1.5}
.msg-c .md{flex:1;min-width:0}
.msg-c.err .bul,.msg-c.err .md{color:var(--err)}
.md p{margin:0 0 .6em}
.md p:last-child,.md ul:last-child,.md ol:last-child{margin-bottom:0}
.md ul,.md ol{margin:.2em 0 .6em;padding-left:1.4em}
.md li{margin:.15em 0}
.md code{font-family:var(--font-mono);font-size:.92em;background:#333;border-radius:4px;padding:1px 5px;color:#e8c27a;word-break:break-word}
.md pre.md-code{font-family:var(--font-mono);font-size:var(--fs-code);background:var(--bg-term);border:1px solid var(--line);border-radius:6px;padding:8px 10px;margin:.4em 0 .6em;overflow-x:auto;white-space:pre}
.md strong{color:var(--fg-strong)}
.tbl-wrap{overflow-x:auto;margin:.4em 0 .6em}
.md table{border-collapse:collapse;min-width:100%;width:max-content}
.md td,.md th{min-width:7.5em}
.md th,.md td{border:1px solid var(--line);padding:6px 10px;text-align:left;vertical-align:top}
.md th{background:var(--bg-raise);color:var(--fg-strong)}
.tool{margin:12px 0;border:1px solid var(--line);border-radius:8px;background:var(--bg-panel);overflow:hidden}
.tool-h{display:flex;align-items:baseline;gap:8px;padding:8px 12px;background:var(--bg-raise);border-bottom:1px solid var(--line)}
.tool-h .bul{color:var(--ok)}
.tool-h b{color:var(--fg-strong)}
.tool-h .ttl{color:var(--fg);min-width:0;word-break:break-word}
.sec{display:flex;gap:10px;padding:8px 12px;border-top:1px solid var(--line-soft);align-items:flex-start}
.sec:first-of-type{border-top:0}
.sec .lbl{flex:none;width:3.2em;color:var(--fg-dim);font-weight:600;padding-top:0}
.sec .box{flex:1;min-width:0;position:relative}
.sec pre{margin:0;font:var(--fs-code)/1.45 var(--font-mono);white-space:pre;overflow-x:auto;color:var(--fg)}
.sec.in pre{color:#9cdcfe}
.cl{position:relative;font-size:var(--fs-code)}
.cl.clamp{max-height:calc(var(--n,6)*1.45em);overflow:hidden}
.cl.clamp::after{content:"";position:absolute;left:0;right:0;bottom:0;height:2.2em;background:linear-gradient(transparent,var(--bg-panel));pointer-events:none}
.cl.clamp.open{max-height:none}
.cl.clamp.open::after{display:none}
.sec .more{display:block;width:100%;min-height:44px;margin-top:4px;border:0;border-radius:6px;background:#2f2f33;color:var(--info);text-align:left;padding:0 10px}
.sec.pending{color:var(--fg-dim);align-items:center}
.readrow{display:flex;gap:8px;align-items:baseline;margin:6px 0;color:var(--fg-dim)}
.readrow .bul{color:var(--ok)}
.readrow b{color:var(--fg)}
.composer{flex:none;display:flex;align-items:flex-end;gap:8px;padding:8px 8px 8px 12px;border-top:1px solid var(--line);background:var(--bg-panel)}
.composer .gt{font-family:var(--font-mono);color:var(--claude);font-weight:700;padding-bottom:12px}
.composer textarea{flex:1;min-width:0;resize:none;background:transparent;border:0;outline:0;font-size:16px;line-height:1.4;max-height:112px;min-height:48px;padding:12px 0;color:var(--fg-strong);font-family:var(--font-ui)}
.composer textarea:disabled{opacity:.55}
.composer .btn{flex:none}
.modebar{flex:none;display:none;gap:10px;padding:10px 12px 0;background:var(--bg-panel)}
.modebar.on{display:flex}
.modebar .btn{flex:1;border-color:#5a5a5e}
#paneClaude .hintrow{background:var(--bg-panel)}
.idlecard{margin:16px 12px;padding:14px;border:1px dashed var(--line);border-radius:8px;color:var(--fg-dim)}

/* ============ Lớp phủ, hộp thoại ============ */
.overlay{position:fixed;inset:0;z-index:40;background:var(--bg);display:none;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
.overlay.on{display:flex}
.ovhead{flex:none;display:flex;align-items:center;gap:8px;height:52px;padding:0 4px 0 14px;background:var(--bg-title);border-bottom:1px solid #000}
.ovhead .ttl{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.ovhead .sub{color:var(--fg-dim);font-weight:400;margin-left:8px}
.iconbtn{width:48px;height:48px;border:0;background:transparent;display:inline-flex;align-items:center;justify-content:center;border-radius:6px;padding:0}
.iconbtn:hover{background:rgba(255,255,255,.08)}
.iconbtn .ic{width:22px;height:22px}
.codewrap{flex:1;min-height:0;overflow:auto;display:flex;align-items:flex-start;background:var(--bg)}
.gutter{position:sticky;left:0;flex:none;padding:10px 10px 10px 12px;text-align:right;color:#6e7681;font:var(--fs-code)/1.5 var(--font-mono);background:var(--bg);user-select:none;-webkit-user-select:none;white-space:pre;border-right:1px solid var(--line-soft)}
.src{margin:0;padding:10px 16px 40px 12px;font:var(--fs-code)/1.5 var(--font-mono);white-space:pre;color:var(--fg);tab-size:2;min-width:0}
.nopreview{margin:auto;padding:24px;text-align:center;color:var(--fg-dim);max-width:30ch}
.p{color:#9cdcfe}.k{color:var(--syn-kw)}.s{color:var(--syn-str)}.c{color:var(--syn-cmt);font-style:italic}.n{color:var(--syn-num)}.f{color:var(--syn-fn)}.t{color:var(--syn-type)}.g{color:var(--syn-tag)}.h{color:var(--syn-head);font-weight:700}

.back{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.6);display:none;align-items:flex-end;justify-content:center}
.back.on{display:flex}
.sheet{width:100%;max-width:520px;max-height:92%;overflow:auto;background:var(--bg-panel);border:1px solid var(--line);border-radius:14px 14px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px))}
.sheet h2{margin:0 0 4px;font-size:21px}
.sheet .sub{margin:0 0 14px;color:var(--fg-dim)}
.sheet .close{float:right;margin:-8px -8px 0 0}
.opt{width:100%;min-height:60px;display:flex;align-items:center;gap:14px;padding:0 14px;margin:0 0 10px;border:1px solid var(--line);border-radius:10px;background:var(--bg-raise);text-align:left;font-weight:600}
.opt:hover{background:var(--bg-sel)}
.opt .ic{width:34px;height:34px}
.opt .mini{display:block;color:var(--fg-dim);font-weight:400;font-size:.9em}
.hintbox{margin:6px 0 0;padding:10px 12px;border-radius:8px;background:var(--claude-bg);border:1px solid var(--claude-line);color:var(--claude);display:none}
.hintbox.on{display:block;animation:shake .35s}
@keyframes shake{0%,100%{transform:none}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.badgebox{display:flex;justify-content:center;margin:2px 0 6px}
.badgebox svg{width:104px;height:104px}
.sheet.done{text-align:center}
.sheet.done .list{text-align:left;margin:12px 0 16px;padding:0;list-style:none;display:grid;gap:8px}
.sheet.done .list li{display:flex;gap:10px;align-items:flex-start}
.sheet.done .list .ic{width:22px;height:22px;color:var(--ok);margin-top:1px}
.sheet.done .list li.off{color:var(--fg-dim)}
.sheet.done .list li.off .ic{color:var(--fg-dim)}
.sheet .row{display:flex;gap:10px;flex-wrap:wrap}
.sheet .row .btn{flex:1}
.spk-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:10px 0}
.spk-grid .btn{justify-content:flex-start;white-space:normal;text-align:left;min-height:52px;padding:6px 12px}
.spk-grid .btn.cur{outline:2px solid var(--warn)}
.confirm{margin-top:10px;padding:12px;border:1px solid var(--err);border-radius:8px;display:none}
.confirm.on{display:block}

/* Trình duyệt giả lập */
#browser{z-index:70;background:#fff}
#browser .ovhead{background:#dfe1e5;border-bottom:1px solid #c4c7c5;color:#202124;padding:0 6px;gap:4px}
#browser .iconbtn{color:#5f6368}
#browser .iconbtn:hover{background:rgba(0,0,0,.08)}
#browser .iconbtn[disabled]{opacity:.4;cursor:default}
.addr{flex:1;min-width:0;height:38px;border-radius:19px;background:#fff;display:flex;align-items:center;gap:8px;padding:0 14px;color:#202124;overflow:hidden}
.addr .ic{width:16px;height:16px;color:#5f6368}
.addr span{white-space:nowrap;overflow-x:auto;scrollbar-width:none;font-size:16px}
.addr span::-webkit-scrollbar{display:none}
#browser iframe{flex:1;min-height:0;border:0;width:100%;background:#fff}
.loadingpage{flex:1;display:flex;align-items:center;justify-content:center;gap:12px;color:#5f6368;background:#fff}

/* Toast */
#toasts{position:fixed;top:calc(env(safe-area-inset-top,0px) + 56px);left:50%;transform:translateX(-50%);z-index:100;display:flex;flex-direction:column;gap:8px;pointer-events:none;width:max-content;max-width:calc(100% - 24px)}
.toast{display:flex;align-items:center;gap:10px;padding:10px 16px;border-radius:24px;background:#1f3a2a;border:1px solid #2f6b47;color:#d9f5df;font-weight:600;box-shadow:0 4px 16px rgba(0,0,0,.5);animation:tin .25s ease-out}
.toast.out{opacity:0;transition:opacity .3s}
.toast .ic{color:var(--ok)}
@keyframes tin{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}

/* Watermark editor (laptop) */
.wm{margin:auto;text-align:center;color:var(--fg-dim);padding:24px}
.wm .ic{width:120px;height:120px;color:#2c3a4a;display:block;margin:0 auto 16px}

/* ============ Laptop ============ */
@media (min-width:900px){
  :root{--fs:14px;--fs-code:13.5px;--row-h:26px;--btn-h:36px}
  #logoBtn{width:48px}
  #main{display:grid;grid-template-columns:290px minmax(0,1fr);grid-template-rows:minmax(0,1fr)}
  #app.tab-term #main,#app.tab-claude #main{grid-template-columns:290px minmax(0,1fr) minmax(380px,460px)}
  #paneProject,#paneEditor{display:flex}
  #paneTerm,#paneClaude{flex:1;border-top:0}
  #app.tab-term #task,#app.tab-claude #task{display:block}
  #app.tab-term #cta,#app.tab-claude #cta{display:block}
  #app.tab-term #cta:not(.on),#app.tab-claude #cta:not(.on){display:none}
  #app.tab-project #rightCol{display:none}
  #paneProject{border-right:1px solid var(--line);background:var(--bg-panel)}
  #paneEditor{display:flex;flex-direction:column;min-width:0;min-height:0;background:var(--bg)}
  #rightCol{display:flex;flex-direction:column;min-width:0;min-height:0;border-left:1px solid var(--line);background:var(--bg)}
  .chipbar{display:none}
  #app:not(.ide) #main{display:none}
  .trow{padding-right:8px}
  .trow .ic{width:16px;height:16px}
  .pill{font-size:11px;padding:3px 6px}
  .btn.big{min-height:56px}
  .tab{min-height:48px}
  #status{font-size:12.5px;padding:3px 12px}
  .inrow input,.composer textarea{font-size:14px}
  .inrow input{height:38px}
  .composer textarea{min-height:38px;padding:8px 0}
  .composer .gt{padding-bottom:8px}
  .chip{min-height:32px}
  .iconbtn{width:36px;height:36px}
  .sec .more,.chipbtn{min-height:36px}
  .opt{min-height:56px}
  .sheet{border-radius:14px;margin-bottom:6vh;align-self:center}
  .back{align-items:center}
  .ovhead{height:44px}
  .etabs{display:flex;flex:none;background:var(--bg-panel);overflow-x:auto;border-bottom:1px solid var(--line)}
  .etab{display:flex;align-items:center;gap:8px;min-height:36px;padding:0 6px 0 12px;border-right:1px solid var(--line);color:var(--fg-dim);background:transparent;border-top:0;border-bottom:0;border-left:0;white-space:nowrap}
  .etab.active{background:var(--bg);color:var(--fg-strong);box-shadow:inset 0 1px 0 var(--accent)}
  .etab .x{width:22px;height:22px;display:inline-flex;align-items:center;justify-content:center;border-radius:4px}
  .etab .x:hover{background:rgba(255,255,255,.12)}
  .etab .x .ic{width:14px;height:14px}
  #overlayFile{display:none !important}
  #browser .ovhead{height:48px}
}
@media (max-width:899.98px){
  .etabs{display:none}
}
@media (max-width:520px){
  #browser .ovhead .iconbtn:nth-child(2),#browser .ovhead .iconbtn:nth-child(3){display:none}
}
@media (min-width:1500px){
  #app.tab-term #main,#app.tab-claude #main{grid-template-columns:320px minmax(0,1fr) 520px}
}
@media (prefers-reduced-motion:reduce){
  .tab.pulse:not(.active),.rtab.pulse:not(.active){animation:none;background:var(--new-bg);box-shadow:inset 0 0 0 2px var(--new)}
  .trow.is-new,.chip.is-new{animation:none;background:var(--new-bg)}
  .spin{animation-duration:2.4s}
  .toast{animation:none}
  .hintbox.on{animation:none}
}

/* ============ Biểu tượng terminal / Claude trên thanh tiêu đề ============ */
.tbicon{width:48px;height:48px;color:var(--fg-dim);border-radius:0}
.tbicon .ic{width:22px;height:22px}
.tbicon:hover{color:var(--fg-strong)}
.tbicon.active{color:var(--fg-strong);background:rgba(255,255,255,.12);box-shadow:inset 0 -2px 0 var(--accent)}
#app:not(.ide) .tbicon{display:none}
.phead{flex:none;display:flex;align-items:center;justify-content:space-between;min-height:44px;padding:0 2px 0 12px;background:var(--bg-title);border-bottom:1px solid #000;font-weight:600}
.phead .pt{display:flex;align-items:center;gap:8px}
.phead .pt .ic{width:18px;height:18px}

/* ============ Tạo project, kéo file ============ */
.form h3{margin:0 0 8px;font-size:18px}
.form label{display:block;color:var(--fg-dim);margin-bottom:4px}
.field{width:100%;min-height:48px;padding:0 12px;border-radius:6px;border:1px solid var(--line);background:var(--bg-input);color:var(--fg-strong);font-size:16px;font-family:var(--font-mono)}
.field:focus{outline:2px solid var(--accent);outline-offset:-1px}
.helper{color:var(--fg-dim);margin:6px 0 10px;font-size:.95em}
.ferr{color:var(--err);min-height:0;margin:0 0 8px}
.ferr:empty{display:none}
.ferr.on{animation:shake .35s}
.frow{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.frow .btn{flex:1 1 auto}
.srccard{border:1px solid var(--line);border-radius:10px;background:var(--bg-raise);padding:10px 12px}
.srctitle{display:flex;align-items:center;gap:8px;color:var(--fg-dim);margin-bottom:8px;font-weight:600}
.srcfile{display:inline-flex;align-items:center;gap:8px;min-height:48px;padding:0 14px;border:1px solid var(--line);border-radius:8px;background:var(--bg);cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none}
.srcfile.lifted{opacity:.45}
.srcfile .ic{width:20px;height:20px}
.linkbtn{border:0;background:transparent;color:var(--info);min-height:44px;padding:0;text-decoration:underline;text-align:left}
.dropzone{margin:12px;min-height:140px;border:2px dashed var(--line);border-radius:12px;display:flex;align-items:center;justify-content:center;text-align:center;color:var(--fg-dim);padding:16px}
#tree.dragover{background:var(--new-bg);outline:2px dashed var(--accent);outline-offset:-4px}
#tree.dragover .dropzone{border-color:var(--accent);color:var(--fg-strong)}
.dragghost{position:fixed;left:0;top:0;z-index:200;pointer-events:none;display:flex;align-items:center;gap:8px;padding:8px 14px;border-radius:8px;background:#3a3d41;border:1px solid var(--accent);color:var(--fg-strong);box-shadow:0 6px 18px rgba(0,0,0,.55)}

.pbtns{display:flex}
.phead .iconbtn{width:44px;height:44px}
@media (min-width:900px){ .pmaxbtn{display:none} }

/* Điện thoại: khi mở Terminal/Claude, khung cây file co lại đúng bằng phần còn lại phía trên panel để cuộn được hết danh sách */
@media (max-width:899.98px){
  #app.tab-term:not(.pmax):not(.kb) #paneProject,#app.tab-claude:not(.pmax):not(.kb) #paneProject{flex:0 0 var(--split,42%);min-height:0}
}
@media (max-width:899.98px){
  #app.tab-term:not(.pmax):not(.kb) #cta,#app.tab-claude:not(.pmax):not(.kb) #cta,
  #app.tab-term:not(.pmax):not(.kb) .panehead,#app.tab-claude:not(.pmax):not(.kb) .panehead{display:none}
}

/* Laptop: panel nằm trong cột phải, không phủ lên cây file/editor */
@media (min-width:900px){
  #paneTerm,#paneClaude{position:static;top:auto;left:auto;right:auto;bottom:auto;z-index:auto;box-shadow:none;border-top:0;flex:1 1 0;min-height:0}
  #app.tab-term #paneProject,#app.tab-claude #paneProject{flex:none}
}

/* ============ Điện thoại: panel toàn màn hình + ngăn kéo cây file ============ */
.peekclose{display:none}
[data-panel-peek]{position:relative}
[data-panel-peek] i{position:absolute;top:8px;right:7px;width:10px;height:10px;border-radius:50%;background:var(--new);display:none}
#app.newfiles [data-panel-peek] i{display:block}
#app.newfiles [data-panel-peek]{animation:pulse 1.7s ease-in-out infinite}
.pmaxbtn{display:none !important}
@media (min-width:900px){ [data-panel-peek]{display:none} }
@media (max-width:899.98px){
  #paneTerm,#paneClaude{position:absolute;left:0;right:0;bottom:0;top:0 !important;z-index:20;border-top:0;box-shadow:none;flex:none}
  #app.tab-term:not(.pmax):not(.kb) #paneProject,#app.tab-claude:not(.pmax):not(.kb) #paneProject{flex:1 1 auto}
  #app.peek #paneProject{display:flex;position:fixed;left:0;right:0;bottom:0;top:26%;z-index:35;flex:none !important;border-top:2px solid var(--accent);box-shadow:0 -12px 32px rgba(0,0,0,.65);background:var(--bg);padding-bottom:env(safe-area-inset-bottom,0px)}
  #app.peek .panehead{display:flex !important;background:var(--bg-title);color:var(--fg);min-height:48px;padding:0 4px 0 12px}
  #app.peek .peekclose{display:inline-flex}
  #app.peek #cta{display:none !important}
  #app.tab-term:not(.peek) #task,#app.tab-claude:not(.peek) #task{display:none}
}

/* Nút Diễn giả luôn ẩn; bảng diễn giả chỉ mở khi chạm 5 lần vào logo */
#spkBadge,#app.speaker #spkBadge{display:none !important}

/* Logo Claude: tia sáng màu cam */
#btnClaude .ic,#paneClaude .phead .pt .ic{color:#d97757}
#btnClaude.active .ic{color:#e9906f}

/* Nút Mode được khuyên dùng */
.modebar .btn.rec{flex-direction:column;gap:0;line-height:1.2;background:var(--btn);border:2px solid #4fa3e0;box-shadow:0 0 0 3px rgba(55,148,255,.28)}
.modebar .btn.rec small{font-size:14px;font-weight:700;color:#cfe8ff;letter-spacing:.2px}
.modebar{padding-bottom:8px}

</style>
</head>

<div id="app" class="tab-project">
  <header id="topbar">
    <button id="logoBtn" type="button" aria-label="Logo VSAF"><svg class="ic"><use href="#i-vscode"/></svg></button>
    <div id="projTitle">VSAF</div>
    <button id="btnTerm" class="iconbtn tbicon" type="button" aria-label="Terminal"><svg class="ic"><use href="#i-term"/></svg></button>
    <button id="btnClaude" class="iconbtn tbicon" type="button" aria-label="Claude"><svg class="ic"><use href="#i-spark"/></svg></button>
    <button id="spkBadge" type="button" aria-label="Mở bảng diễn giả">Diễn giả</button>
  </header>

  <section id="task" aria-live="polite">
    <div id="segs"></div>
    <div id="taskRow"><div id="taskText"></div><button id="taskBtn" class="btn" type="button" hidden></button></div>
  </section>

  <!-- Màn hình cài VSAF + mở IDE -->
  <section id="launcher" aria-label="Cài đặt VSAF"></section>

  <div id="main">
    <aside id="paneProject" class="pane" aria-label="Project">
      <div class="panehead"><span id="treeTitle">Thư mục dự án</span><button class="iconbtn peekclose" data-peek-close type="button" aria-label="Đóng cây file"><svg class="ic"><use href="#i-close"/></svg></button></div>
      <div id="cta"></div>
      <div id="tree" role="tree"></div>
    </aside>

    <section id="paneEditor" class="pane" aria-label="Trình soạn thảo">
      <div class="etabs" id="etabs"></div>
      <div id="editorBody" style="flex:1;min-height:0;display:flex;flex-direction:column"></div>
    </section>

    <div id="rightCol">

      <section id="paneTerm" class="pane" aria-label="Terminal">
        <div class="phead"><span class="pt"><svg class="ic"><use href="#i-term"/></svg>Terminal</span><span class="pbtns"><button class="iconbtn" data-panel-peek type="button" aria-label="Xem cây file"><svg class="ic"><use href="#i-tree"/></svg><i></i></button><button class="iconbtn pmaxbtn" data-panel-max type="button" aria-label="Phóng to hoặc thu nhỏ panel"><svg class="ic"><use href="#i-max"/></svg></button><button class="iconbtn" data-panel-close type="button" aria-label="Đóng terminal"><svg class="ic"><use href="#i-close"/></svg></button></span></div>
        <div class="outwrap" id="termWrap">
          <div class="scroller" id="termScroll"><div id="termOut"></div></div>
        </div>
        <div class="hintrow" id="termHints"></div>
        <div class="inrow">
          <span class="prompt" id="termPrompt"></span>

          <button class="btn" id="termGo" type="button">Chạy</button>
        </div>
      </section>

      <section id="paneClaude" class="pane" aria-label="Claude">
        <div class="phead"><span class="pt"><svg class="ic"><use href="#i-spark"/></svg>Claude Code</span><span class="pbtns"><button class="iconbtn" data-panel-peek type="button" aria-label="Xem cây file"><svg class="ic"><use href="#i-tree"/></svg><i></i></button><button class="iconbtn pmaxbtn" data-panel-max type="button" aria-label="Phóng to hoặc thu nhỏ panel"><svg class="ic"><use href="#i-max"/></svg></button><button class="iconbtn" data-panel-close type="button" aria-label="Đóng Claude"><svg class="ic"><use href="#i-close"/></svg></button></span></div>
        <div class="outwrap" id="chatWrap">
          <div class="scroller" id="chatScroll"><div id="chat"></div></div>
        </div>
        <div class="modebar" id="modeBar"></div>
        <div class="hintrow" id="claudeHints"></div>

          <span class="gt">&gt;</span>

    </div>
  </div>

  <footer id="status"><span id="stLeft"></span><span id="stRight"></span></footer>
</div>

<!-- Xem file (điện thoại) -->

<!-- Hộp thoại Mở bằng… -->
<div class="back" id="openWith" role="dialog" aria-modal="true" aria-label="Mở bằng">

    <button class="iconbtn close" type="button" data-close aria-label="Đóng"><svg class="ic"><use href="#i-close"/></svg></button>
    <h2>Mở bằng…</h2>
    <p class="sub" id="owName"></p>
    <button class="opt" type="button" data-app="chrome"><svg class="ic"><use href="#i-chrome"/></svg><span>Chrome</span></button>
    <button class="opt" type="button" data-app="text"><svg class="ic"><use href="#i-doc"/></svg><span>Trình soạn thảo văn bản</span></button>
    <div class="hintbox" id="owHint" role="status">Hãy thử mở bằng Chrome.</div>
  </div>
</div>

      "import { expect, test, type APIRequestContext, type APIResponse } from '@playwright/test';",
      "type Query = Record<string, string | number | boolean>;",
      "export interface RequestOptions {",
      "  params?: Query;",
      "  headers?: Record<string, string>;",
      "  /** JSON body (object) — sent as application/json. */",
      "  data?: unknown;",
      "  /** multipart/form-data body (file upload). */",
      "  multipart?: Record<string, string | number | boolean | { name: string; mimeType: string; buffer: Buffer }>;",
      "  /**",
      "   * Expected HTTP status; default: any 2xx. A number for negative cases (400, 401, 404...).",
      "   * 'any' = no status check here — BDD style where a later Then step asserts the status.",
      "   */",
      "  expectStatus?: number | 'any';",
      "}",
      "/**",
      " * Thin wrapper over Playwright's APIRequestContext — every service class calls this,",
      " * never request.get/post directly. Adds: auth header, status assertion, step logging",
      " * (shows in the HTML report / trace), typed JSON parsing.",
      " */",
      "export class ApiClient {",
      "  private authHeader: Record<string, string> = {};",
      "  constructor(private readonly request: APIRequestContext) {}",
      "  /** Set the Authorization header for later calls (format follows api-reference.md). */",
      "  setToken(token: string, scheme: 'Bearer' | 'raw' = 'Bearer'): void {",
      "    this.authHeader = { Authorization: scheme === 'raw' ? token : `Bearer ${token}` };",
      "  }",
      "  clearToken(): void {",
      "    this.authHeader = {};",
      "  }",
      "  get(url: string, options: RequestOptions = {}): Promise<APIResponse> {",
      "    return this.send('GET', url, options);",
      "  }",
      "  post(url: string, options: RequestOptions = {}): Promise<APIResponse> {",
      "    return this.send('POST', url, options);",
      "  }",
      "  put(url: string, options: RequestOptions = {}): Promise<APIResponse> {",
      "    return this.send('PUT', url, options);",
      "  }",
      "  patch(url: string, options: RequestOptions = {}): Promise<APIResponse> {",
      "    return this.send('PATCH', url, options);",
      "  }",
      "  delete(url: string, options: RequestOptions = {}): Promise<APIResponse> {",
      "    return this.send('DELETE', url, options);",
      "  }",
      "  /** Parse JSON body with a type. Fails with the raw body if it is not JSON. */",
      "  static async json<T>(response: APIResponse): Promise<T> {",
      "    const body = await response.text();",
      "    try {",
      "      return JSON.parse(body) as T;",
      "    } catch {",
      "      throw new Error(`Response không phải JSON (${response.status()} ${response.url()}): ${body.slice(0, 500)}`);",
      "    }",
      "  }",
      "  private async send(method: string, url: string, options: RequestOptions): Promise<APIResponse> {",
      "    return test.step(`${method} ${url}`, async () => {",
      "      const response = await this.request.fetch(url, {",
      "        method,",
      "        params: options.params,",
      "        headers: { ...this.authHeader, ...options.headers },",
      "        data: options.data,",
      "        multipart: options.multipart,",
      "      });",
      "      if (options.expectStatus === 'any') {",
      "        return response;",
      "      }",
      "      if (options.expectStatus !== undefined) {",
      "        expect(response.status(), `${method} ${url} → ${await response.text()}`).toBe(options.expectStatus);",
      "      } else {",
      "        expect(response.ok(), `${method} ${url} → ${response.status()} ${await response.text()}`).toBeTruthy();",
      "      }",
      "      return response;",
      "    });",
      "  }",
      "}"
    ],

      "  const url = resolveDynamic(row.url);",
      "  // Giống Mode D của Robot Framework: GET gửi request_body thành query params, method khác gửi JSON body.",
      "  const options = row.method === 'GET' ? { params: toQuery(body) } : { data: body };",
      "  const verb = row.method.toLowerCase() as 'get' | 'post' | 'put' | 'patch' | 'delete';",
      "  const response = await client[verb](url, { ...options, expectStatus: 'any' });",
      "  const text = await response.text();",
      "  let parsed: unknown = text;",
      "  try {",
      "    parsed = text ? JSON.parse(text) : undefined;",
      "  } catch {",
      "    // Không phải JSON: giữ nguyên chuỗi, bước Then so như chuỗi.",
      "  }",
      "  return { row, status: response.status(), body: parsed };",
      "}",

      "",

      "",

      "  if (row.expected !== undefined) problems.push(...diffSubset(body, row.expected));",

function mdInline(s) {
  s = esc(s);
  const codes = [];
  s = s.replace(/`([^`]+)`/g, (m, c) => { codes.push(c); return '\u0000' + (codes.length - 1) + '\u0000'; });
  s = s.replace(/\*\*([^*]+?)\*\*/g, '<strong>$1</strong>');
  s = s.replace(/(^|[^*\w])\*([^*\s][^*]*?)\*(?!\*)/g, '$1<em>$2</em>');
  return s.replace(/\u0000(\d+)\u0000/g, (m, i) => '<code>' + codes[+i] + '</code>');
}
function mdRender(src) {
  const L = src.split('\n'), out = [];

  while (i < L.length) {
    const l = L[i];
    if (/^```/.test(l)) {
      const buf = []; let j = i + 1;
      while (j < L.length && !/^```/.test(L[j])) buf.push(L[j++]);
      out.push('<pre class="md-code">' + esc(buf.join('\n')) + '</pre>');
      i = j + 1; continue;
    }
    if (/^\s*$/.test(l)) { i++; continue; }
    if (isTable(l)) {
      const rows = []; let j = i;
      while (j < L.length && isTable(L[j])) rows.push(L[j++]);
      if (rows.length >= 2 && /^\s*\|[\s:|-]+\|?\s*$/.test(rows[1])) {
        const cells = r => r.trim().replace(/^\|/, '').replace(/\|$/, '').split('|').map(c => c.trim());
        const head = cells(rows[0]);
        let h = '<div class="tbl-wrap"><table><thead><tr>' + head.map(c => '<th>' + mdInline(c) + '</th>').join('') + '</tr></thead><tbody>';
        rows.slice(2).forEach(r => { h += '<tr>' + cells(r).map(c => '<td>' + mdInline(c) + '</td>').join('') + '</tr>'; });
        out.push(h + '</tbody></table></div>');
      } else {
        out.push('<p>' + rows.map(mdInline).join('<br>') + '</p>');
      }
      i = j; continue;
    }
    if (isList(l)) {
      const ordered = /^\s*\d+\./.test(l); const items = []; let j = i;
      while (j < L.length && isList(L[j])) { items.push(L[j].replace(/^\s*([*-]|\d+\.)\s+/, '')); j++; }
      const tag = ordered ? 'ol' : 'ul';
      out.push('<' + tag + '>' + items.map(x => '<li>' + mdInline(x) + '</li>').join('') + '</' + tag + '>');
      i = j; continue;
    }
    const para = []; let j = i;
    while (j < L.length && !/^\s*$/.test(L[j]) && !isList(L[j]) && !isTable(L[j]) && !/^```/.test(L[j])) para.push(L[j++]);
    out.push('<p>' + para.map(mdInline).join('<br>') + '</p>');
    i = j;
  }
  return out.join('');
}

/* =====================================================================
   Tô màu cú pháp (nhẹ)
   ===================================================================== */
const RE = {
  ts: [/(\/\*[\s\S]*?\*\/|\/\/[^\n]*)|('(?:\\.|[^'\\\n])*'|"(?:\\.|[^"\\\n])*"|`(?:\\.|[^`\\])*`)|\b(import|export|from|const|let|var|function|async|await|return|if|else|new|class|interface|type|extends|implements|private|readonly|public|static|as|of|in|for|while|throw|try|catch|void|typeof|default|enum|declare|true|false|null|undefined)\b|\b(\d+(?:\.\d+)?)\b|\b([A-Z][A-Za-z0-9_]*)\b|\b([A-Za-z_$][\w$]*)(?=\()/g, ['c', 's', 'k', 'n', 't', 'f']],
  json: [/("(?:\\.|[^"\\])*")(?=\s*:)|("(?:\\.|[^"\\])*")|\b(true|false|null)\b|(-?\b\d+(?:\.\d+)?\b)/g, ['p', 's', 'k', 'n']],
  feature: [/(#[^\n]*)|(@[\w:\-]+)|("[^"\n]*")|(^\s*(?:Feature|Scenario Outline|Scenario|Background|Examples|Given|When|Then|And|But)\b)/gm, ['c', 'g', 's', 'k']],
  md: [/(^#{1,6}[^\n]*)|(\*\*[^*\n]+\*\*)|(`[^`\n]+`)|(^\s*(?:[-*]|\d+\.)\s)/gm, ['h', 't', 's', 'k']],
  env: [/(#[^\n]*)|(^[A-Za-z_][A-Za-z0-9_]*)(?==)/gm, ['c', 'p']],
  hash: [/(#[^\n]*)|("(?:\\.|[^"\\\n])*"|'(?:\\.|[^'\\\n])*')/g, ['c', 's']]
};
function langOf(p) {
  const name = baseName(p), ext = name.split('.').pop().toLowerCase();
  if (name.indexOf('.env') === 0) return 'env';
  return ({ ts: 'ts', js: 'ts', tsx: 'ts', md: 'md', json: 'json', feature: 'feature', yml: 'hash', yaml: 'hash', py: 'hash', sh: 'hash' })[ext] || 'txt';
}
function hl(text, lang) {
  const def = RE[lang];
  if (!def) return esc(text);
  const re = def[0], map = def[1];
  let out = '', last = 0, m;
  re.lastIndex = 0;
  while ((m = re.exec(text))) {
    if (m[0].length === 0) { re.lastIndex++; continue; }
    out += esc(text.slice(last, m.index));
    let cls = null;
    for (let i = 1; i < m.length; i++) { if (m[i] !== undefined) { cls = map[i - 1]; break; } }
    out += cls ? '<span class="' + cls + '">' + esc(m[0]) + '</span>' : esc(m[0]);
    last = m.index + m[0].length;
  }
  return out + esc(text.slice(last));
}
function extCls(p) {
  const name = baseName(p), ext = name.split('.').pop().toLowerCase();
  if (name.indexOf('.env') === 0) return 'ic-env';
  return ({ ts: 'ic-ts', js: 'ic-ts', tsx: 'ic-ts', md: 'ic-md', json: 'ic-json', feature: 'ic-feature', py: 'ic-py', html: 'ic-html', yml: 'ic-yaml', yaml: 'ic-yaml' })[ext] || 'ic-file';
}
function codeBlock(p, text) {
  if (text == null) return '<div class="nopreview">' + esc(CONFIG.ui.noPreview) + '</div>';
  const n = text.split('\n').length; let g = '';
  for (let i = 1; i <= n; i++) g += i + (i < n ? '\n' : '');
  return '<div class="gutter">' + g + '</div><pre class="src">' + hl(text, langOf(p)) + '</pre>';
}

function openChain(p) {
  const parts = p.split('/');

function renderTree() {
  const tree = $('#tree');
  const keep = tree.scrollTop;
  const OPEN = new Set(S.open), now = Date.now(), out = [];
  (function walk(parent) {
    (KIDS.get(parent) || []).forEach(n => {
      if (!vis(n)) return;
      const isDir = n.type === 'dir';
      const hasKids = isDir && !n.note && (KIDS.get(n.path) || []).some(vis);
      const open = isDir && hasKids && OPEN.has(n.path);
      const exp = UI.fresh[n.path];
      const isNew = exp && exp > now;
      const style = 'padding-left:' + (6 + n.depth * 14) + 'px' + (isNew ? ';animation-delay:-' + Math.max(0, 3200 - (exp - now)) + 'ms' : '');
      out.push('<div class="trow ' + (isDir ? 'dir' : 'file') + (open ? ' open' : '') + (UI.sel === n.path ? ' sel' : '') + (isNew ? ' is-new' : '') +
        '" role="treeitem" tabindex="0" data-p="' + esc(n.path) + '" style="' + style + '">' +
        icon('i-chev', 'chev' + (hasKids ? '' : ' none')) +
        (isDir ? icon('i-folder', 'ic-folder') : icon('i-file', extCls(n.path))) +
        '<span class="name">' + esc(n.name) + '</span>' +
        (n.note ? '<span class="note">(' + esc(n.note) + ')</span>' : '') +
        (UI.entry[n.path] && UI.entry[n.path] > now ? '<span class="pill">mới</span>' : '') + '</div>');
      if (open) walk(n.path);
    });
  })('');
  if (!out.length) {
    if (S.f.project && !S.f.tc) out.push('<div class="dropzone" id="dropZone">' + esc(CONFIG.addTestcase.dropText) + '</div>');
    else if (!S.f.project) out.push('<div class="empty">' + esc(CONFIG.projectCreate.emptyText) + '</div>');
  }
  tree.innerHTML = out.join('');
  tree.scrollTop = keep;
}

function applyMilestone(name, silent) {
  if (S.ms[name]) return;
  S.ms[name] = true;
  const newly = CONFIG.fileTree.nodes.filter(n => n.at === name).map(n => n.path);
  const set = new Set(newly);
  (CONFIG.fileTree.autoOpen[name] || []).forEach(openChain);
  if (!silent) {
    const exp = Date.now() + 3200;
    newly.forEach(p => {
      UI.fresh[p] = exp;
      const n = NODE.get(p);
      if (!n.parent || !set.has(n.parent)) UI.entry[p] = exp;

    setTimeout(() => { newly.forEach(p => { delete UI.fresh[p]; delete UI.entry[p]; }); renderTree(); renderChips(); }, 3300);
    if (!isDesk() && UI.tab !== 'project') $('#app').classList.add('newfiles');

    const tr = $('#tree'), e = $('#tree .is-new');

}

const termOut = $('#termOut');
function tcolor(s) {
  return esc(s).replace(/^\[vsaf\]/, '<span class="t-vsaf">[vsaf]</span>').replace(/^\[autotest\]/, '<span class="t-auto">[autotest]</span>').replace(/^\[MR\]/, '<span class="t-auto">[MR]</span>');
}
function tline(html, cls) {
  const d = mk('div', 'tl' + (cls ? ' ' + cls : ''), html);
  termOut.appendChild(d); scrollEnd($('#termScroll'), 'term'); return d;
}
const echoCmd = c => tline('<span class="prompt">' + esc(VARS.projectName) + ' $</span> ' + esc(c));
function printWelcome() {
  termOut.appendChild(mk('div', 'welcome', esc(lines(CONFIG.claudeWelcome))));
  scrollEnd($('#termScroll'), 'term');
}
function playTermLines(list, opts) {
  const wrap = $('#termWrap');
  wrap.classList.add('playing');
  const spin = mk('div', 'spinrow', '<span class="spin"></span><span>' + esc(opts.spinnerText || '') + '</span>');
  termOut.appendChild(spin); scrollEnd($('#termScroll'), 'term');
  let i = 0, timer = null, done = false;
  const ctl = {
    skip() {
      if (done) return;
      clearTimeout(timer); spin.remove();
      while (i < list.length) { tline(tcolor(sub(list[i]))); i++; }
      finish();
    },
    cancel() { done = true; clearTimeout(timer); spin.remove(); wrap.classList.remove('playing'); UI.term = null; }
  };
  function finish() {
    if (done) return;
    done = true; spin.remove(); wrap.classList.remove('playing'); UI.term = null;
    if (opts.onEnd) opts.onEnd();
  }
  function step() {
    if (i >= list.length) { finish(); return; }
    tline(tcolor(sub(list[i]))); i++;
    timer = setTimeout(step, CONFIG.pacing.termLineMs);
  }
  timer = setTimeout(() => { spin.remove(); step(); }, opts.spinMs || 0);
  UI.term = ctl;
  return ctl;
}
function runTerm(raw) {
  const text = norm(raw);
  echoCmd(text);
  if (!text) return;
  const parts = text.split(' '), cmd = parts[0].toLowerCase(), E = CONFIG.commands.errors;
  if (cmd === 'clear' && parts.length === 1) { termOut.innerHTML = ''; return; }
  if (cmd === 'vsaf') {
    if (text.toLowerCase() === CONFIG.commands.installSkill.command.toLowerCase()) {
      if (!S.f.tc) tline(esc(CONFIG.commands.installSkill.notReadyText), 'hint'); else installSkill();
    }
    else {
      S.vErr = (S.vErr || 0) + 1; save();
      tline(esc(E.invalidVsaf), 'err');
      if (S.vErr >= 2) tline(esc(sub(E.hintVsaf, { correct: CONFIG.commands.installSkill.command })), 'hint');
    }
    return;
  }
  if (cmd === CONFIG.commands.launchClaude.command.toLowerCase()) {
    if (parts.length > 1) { tline(esc(CONFIG.commands.launchClaude.invalidText), 'err'); return; }
    launchClaude(); return;
  }
  tline(esc(sub(E.notFound, { cmd: parts[0] })), 'err');
}
function installSkill() {
  const first = !S.f.skill;
  playTermLines(CONFIG.commands.installSkill.output, {
    spinnerText: CONFIG.commands.installSkill.spinnerText,
    spinMs: first ? CONFIG.pacing.installSpinnerMs : 300,
    onEnd() { if (first) { applyMilestone('installSkill'); setFlag('skill'); } }
  });
}
function launchClaude() {
  if (!S.f.skill) { tline(esc(CONFIG.commands.launchClaude.notReadyText), 'hint'); return; }

  if (!S.f.claude) { setFlag('claude'); rebuildEmptyChat(); }

}

const readHTML = b => '<span class="bul">●</span><b>Read</b><span>' + esc(b.name) + '</span>';

function staticBlock(b, silent) {
  if (b.type === 'text') addClaude(sub(lines(b.text)));
  else if (b.type === 'tool') {
    const r = mk('div', 'tool', toolHead(b) + toolIn(b) + (b.out != null ? toolOut(b) : ''));
    clearEmpty(); chat.appendChild(r);
  } else if (b.type === 'read') { clearEmpty(); chat.appendChild(mk('div', 'readrow', readHTML(b))); }
  else if (b.type === 'event') applyMilestone(b.name, silent);
}
function timeScale(blocks, key) {
  const P = CONFIG.pacing, target = P.turnSeconds && P.turnSeconds[key];
  if (!target) return 1;
  let t = 0;
  blocks.forEach(b => {
    if (b.type === 'text') t += lines(b.text).length / CONFIG.typingSpeed * 1000;
    else if (b.type === 'tool') t += P.toolInMs + (b.out == null ? 0 : P.toolOutMs);
    else if (b.type === 'read') t += P.readMs;
    else if (b.type === 'spinner') t += (b.seconds || 2) * 1000;
    t += P.gapMs;
  });
  return Math.min(4, Math.max(0.25, target * 1000 / Math.max(1, t)));
}
function playScript(blocks, key, hooks) {
  if (UI.chatCtl) UI.chatCtl.skip();
  const P = CONFIG.pacing, k = timeScale(blocks, key), wrap = $('#chatWrap');
  let idx = 0, timers = [], cur = null, finished = false;
  const at = (fn, ms) => { timers.push(setTimeout(fn, ms * k)); };
  const sc = $('#chatScroll');
  wrap.classList.add('playing');

  function startBlock(b, done) {
    if (b.type === 'text') {
      const md = sub(lines(b.text)), d = addClaude(''), el = $('.md', d);
      const per = Math.max(1, Math.round(CONFIG.typingSpeed * 0.04 / k));
      let n = 0, stopped = false;
      const tick = () => {
        if (stopped) return;
        n = Math.min(md.length, n + per);
        el.innerHTML = mdRender(md.slice(0, n)); scrollEnd(sc, 'chat');
        if (n >= md.length) done(); else timers.push(setTimeout(tick, 40));
      };
      tick();
      return { finish() { stopped = true; el.innerHTML = mdRender(md); scrollEnd(sc, 'chat'); } };
    }
    if (b.type === 'tool') {
      const root = mk('div', 'tool', toolHead(b)); clearEmpty(); chat.appendChild(root); scrollEnd(sc, 'chat');
      let stage = 0, pend = null;
      const showIn = () => {
        root.insertAdjacentHTML('beforeend', toolIn(b)); stage = 1; scrollEnd(sc, 'chat');
        if (b.out == null) { done(); return; }
        pend = mk('div', 'sec pending out', '<span class="lbl">OUT</span><span class="spin"></span><span>Đang chạy…</span>');
        root.appendChild(pend); scrollEnd(sc, 'chat');
        at(showOut, P.toolOutMs);
      };
      const showOut = () => { if (pend) pend.remove(); pend = null; root.insertAdjacentHTML('beforeend', toolOut(b)); stage = 2; scrollEnd(sc, 'chat'); done(); };
      at(showIn, P.toolInMs);
      return {
        finish() {
          if (stage < 1) { root.insertAdjacentHTML('beforeend', toolIn(b)); stage = 1; }
          if (stage < 2) { if (pend) pend.remove(); pend = null; if (b.out != null) root.insertAdjacentHTML('beforeend', toolOut(b)); stage = 2; }
          scrollEnd(sc, 'chat');
        }
      };
    }
    if (b.type === 'read') {
      clearEmpty(); chat.appendChild(mk('div', 'readrow', readHTML(b))); scrollEnd(sc, 'chat');
      at(done, P.readMs);
      return { finish() {} };
    }
    if (b.type === 'spinner') {
      clearEmpty();
      const row = mk('div', 'spinrow', '<span class="spin"></span><span>' + esc(b.text || '') + '</span>');
      chat.appendChild(row); scrollEnd(sc, 'chat');
      at(() => { row.remove(); done(); }, (b.seconds || 2) * 1000);
      return { finish() { row.remove(); } };
    }
    if (b.type === 'event') { applyMilestone(b.name); done(); return { finish() {} }; }
    done(); return { finish() {} };
  }
  function nextBlock() {
    if (finished) return;
    if (idx >= blocks.length) { end(); return; }
    const b = blocks[idx++];
    cur = startBlock(b, () => at(nextBlock, P.gapMs));
  }
  function end() {
    if (finished) return;
    finished = true; timers.forEach(clearTimeout); timers = [];
    wrap.classList.remove('playing'); UI.chatCtl = null;
    renderChrome();
    if (hooks && hooks.onEnd) hooks.onEnd();
  }
  const ctl = {
    skip() {
      if (finished) return;
      timers.forEach(clearTimeout); timers = [];
      if (cur) cur.finish();
      while (idx < blocks.length) staticBlock(blocks[idx++], false);
      end();
    },
    cancel() { finished = true; timers.forEach(clearTimeout); timers = []; wrap.classList.remove('playing'); UI.chatCtl = null; }
  };
  UI.chatCtl = ctl;
  renderChrome();
  nextBlock();
  return ctl;
}
function staticScript(blocks) { blocks.forEach(b => staticBlock(b, true)); }

function rebuildChat() {
  if (UI.chatCtl) UI.chatCtl.cancel();
  chat.innerHTML = '';
  if (!S.f.claude) { rebuildEmptyChat(); scrollEnd($('#chatScroll'), 'chat', true); return; }
  let any = false;
  if (S.f.called) { addUser(S.inp.skill || CONFIG.skillCall.sample); staticScript(CONFIG.scripts.step4); any = true; }
  if (S.f.info) { addUser(S.inp.info || CONFIG.infoAnswer.sample); staticScript(CONFIG.scripts.step5); any = true; }
  S.inp.modes.forEach(m => {
    addUser(m.t); any = true;
    staticScript(m.k === 'D' ? CONFIG.scripts.modeDExplain : CONFIG.scripts.step6);
  });
  if (!any) rebuildEmptyChat();
  scrollEnd($('#chatScroll'), 'chat', true);
}

/* ---------- Nhập ở tab Claude ---------- */
function classifyMode(text) {
  let f = fold(text).replace(/[.!?]+$/, '').replace(/^(toi chon|chon)\s+/, '');
  const M = CONFIG.modeChoice;
  if (M.correct.some(x => fold(x) === f)) return 'A';
  if (M.wrong.some(x => fold(x) === f)) return 'D';
  return null;
}
function onClaudeSend() {
  const raw = $('#claudeIn').value;
  if (!S.f.claude || !norm(raw)) return;
  if (UI.chatCtl) UI.chatCtl.skip();
  $('#claudeIn').value = ''; autosize();
  submitClaude(norm(raw));
}
function submitClaude(text) {
  const st = curStep();
  addUser(text);
  if (st === ST.CALL) {
    const low = text.toLowerCase(), pre = CONFIG.skillCall.prefix.toLowerCase();
    if (low === pre || low.indexOf(pre + ' ') === 0) {
      S.inp.skill = text; setFlag('called');
      playScript(CONFIG.scripts.step4, 'step4');
    } else addClaude(sub(CONFIG.skillCall.errorText, { input: text.length > 40 ? text.slice(0, 40) + '…' : text }), 'err');
  } else if (st === ST.INFO) {
    if (fold(text).indexOf(fold(CONFIG.infoAnswer.required)) >= 0) {
      S.inp.info = text; setFlag('info');
      playScript(CONFIG.scripts.step5, 'step5');
    } else addClaude(sub(lines(CONFIG.infoAnswer.missingText)));
  } else if (st === ST.MODE) {
    const k = classifyMode(text);
    if (k === 'A') {
      S.inp.modes.push({ t: text, k: 'A' }); setFlag('mode');
      playScript(CONFIG.scripts.step6, 'step6', { onEnd() { if (curStep() === ST.DONE && !S.f.summary) showDone(); } });
    } else if (k === 'D') {
      S.inp.modes.push({ t: text, k: 'D' }); save();
      playScript(CONFIG.scripts.modeDExplain, 'modeD');
    } else addClaude(sub(lines(CONFIG.modeChoice.unclearText)));
  } else {
    addClaude(CONFIG.ui.claudeIdle);
  }
  renderChrome();
}
function autosize() {
  const ta = $('#claudeIn'); ta.style.height = 'auto';
  ta.style.height = Math.min(ta.scrollHeight, 112) + 'px';
}

   Màn hình VSAF (bước 1) và mở IDE

function renderLauncher() {
  const V = CONFIG.vsafInstall, box = $('#launcher');
  if (S.ide) { box.innerHTML = ''; return; }
  if (UI.launch === 'installing' || UI.launch === 'opening') return;
  const head = icon('i-term', 'mark') + '<h1>' + esc(V.title) + '</h1><p>' + esc(V.tagline) + '</p>';
  if (S.f.vsaf) {
    box.innerHTML = head + '<div class="success">' + icon('i-check') + '<span>' + esc(V.successText) + '</span></div>' +
      '<button type="button" class="btn big" id="openIde">' + icon('i-vscode', 'ideicon') + esc(V.openIdeText) + '</button>';
  } else {
    box.innerHTML = head + '<button type="button" class="btn big" id="installBtn">' + esc(V.buttonText) + '</button><div class="cmd">' + esc(V.command) + '</div>';
  }
}
function startInstall() {
  const V = CONFIG.vsafInstall, box = $('#launcher'), T = Math.max(1, V.seconds) * 1000;
  UI.launch = 'installing';
  box.innerHTML = icon('i-term', 'mark') + '<h1>' + esc(V.title) + '</h1><div class="prog" role="progressbar" aria-label="Tiến độ cài đặt"><i id="progBar"></i></div><div class="logbox" id="logBox" aria-live="polite"></div>';
  const bar = $('#progBar'), log = $('#logBox'), t0 = Date.now();
  let shown = 0;
  UI.launchTimer = setInterval(() => {
    const p = Math.min(1, (Date.now() - t0) / T);
    bar.style.width = (p * 100).toFixed(1) + '%';
    const want = Math.min(V.logs.length, Math.floor(p * V.logs.length) + 1);
    while (shown < want) { log.textContent += (shown ? '\n' : '') + V.logs[shown]; shown++; }
    if (p >= 1) {
      clearInterval(UI.launchTimer); UI.launchTimer = null; UI.launch = null;
      setFlag('vsaf'); renderLauncher();
    }
  }, 100);
}
function openIde() {
  const V = CONFIG.vsafInstall;
  UI.launch = 'opening';
  $('#launcher').innerHTML = icon('i-vscode', 'mark') + '<h1>Visual Studio Code</h1><p>' + esc(V.openingText) + '</p><span class="spin"></span>';
  setTimeout(() => {
    UI.launch = null; S.ide = true; save();
    UI.tab = 'project'; rebuildAll();

}

   Hộp thoại, trình duyệt giả lập, báo cáo Monocart

const show = id => $(id).classList.add('on');
const hide = id => $(id).classList.remove('on');
function goReport() {
  hide('#doneSheet');
  if (S.f.mode) setFlag('summary');
  $('#owName').textContent = CONFIG.monocart.path.split('/').pop() + ' — ' + CONFIG.monocart.path.split('/').slice(0, -1).join('/');
  $('#owHint').classList.remove('on');
  show('#openWith');
}
let REPORT = null;
async function getReportHtml() {
  if (REPORT) return REPORT;
  const M = CONFIG.monocart;
  if (M.html && M.html.trim()) return (REPORT = M.html);
  let b64 = (M.htmlGz || '').trim();
  if (!b64 && M.dataElementId) { const el = document.getElementById(M.dataElementId); if (el) b64 = el.textContent.trim(); }
  if (b64 && 'DecompressionStream' in window) {
    try {
      const bin = atob(b64), u8 = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) u8[i] = bin.charCodeAt(i);
      const stream = new Blob([u8]).stream().pipeThrough(new DecompressionStream('gzip'));
      const text = await new Response(stream).text();
      if (text.length > 100) return (REPORT = text);
    } catch (e) { /* dùng bản giả */ }
  }
  return (REPORT = M.fakeHtml);
}
async function openBrowser() {
  const b = $('#browser'), body = $('#brBody');
  $('#addrText').textContent = sub(CONFIG.monocart.addressBar);
  body.innerHTML = '<div class="loadingpage"><span class="spin"></span><span>Đang mở báo cáo…</span></div>';
  b.classList.add('on');
  setFlag('summary'); setFlag('report');
  let html;
  try { html = await getReportHtml(); } catch (e) { html = CONFIG.monocart.fakeHtml; }
  if (!b.classList.contains('on')) return;
  const f = document.createElement('iframe');
  f.setAttribute('sandbox', 'allow-scripts');
  f.setAttribute('title', 'Báo cáo Monocart');
  f.setAttribute('referrerpolicy', 'no-referrer');
  f.srcdoc = html;
  body.innerHTML = ''; body.appendChild(f);
}
function closeBrowser() {
  hide('#browser'); $('#brBody').innerHTML = '';
}

function cancelAll() {
  if (UI.chatCtl) UI.chatCtl.cancel();
  if (UI.term) UI.term.cancel();
  if (UI.launchTimer) { clearInterval(UI.launchTimer); UI.launchTimer = null; }
  UI.launch = null;
  ['#doneSheet', '#openWith', '#overlayFile'].forEach(hide);
  closeBrowser();
}
function jumpTo(n) {
  cancelAll();
  const keepSpk = S.speaker;
  S = freshState(); S.speaker = keepSpk;
  const f = S.f;
  FLAGS.forEach((k, i) => { f[k] = n > i + 1; });
  S.ide = n >= 2;
  if (n > ST.PROJECT) S.name = CONFIG.projectName;
  if (f.called) S.inp.skill = CONFIG.skillCall.sample;
  if (f.info) S.inp.info = CONFIG.infoAnswer.sample;
  if (f.mode) S.inp.modes = [{ t: CONFIG.modeChoice.buttons[0], k: 'A' }];
  Object.assign(S.ms, impliedMs());
  Object.keys(S.ms).forEach(m => (CONFIG.fileTree.autoOpen[m] || []).forEach(openChain));
  UI.fresh = {}; UI.entry = {}; UI.sel = null; UI.edTabs = []; UI.edActive = null;
  UI.tab = defaultTab();
  save(); rebuildAll();
  hide('#spkSheet');
  toast('Đã nhảy tới bước ' + n);
}
function resetAll() {
  cancelAll();
  const keepSpk = S.speaker;
  S = freshState(); S.speaker = keepSpk;
  UI.fresh = {}; UI.entry = {}; UI.sel = null; UI.edTabs = []; UI.edActive = null; UI.tab = 'project';
  save(); rebuildAll(); hide('#spkSheet');
}

/* =====================================================================

   ===================================================================== */
function bind() {
  bindStick($('#termScroll'), 'term'); bindStick($('#chatScroll'), 'chat');

  // tab
  $('#btnTerm').addEventListener('click', () => setTab(UI.tab === 'term' ? 'project' : 'term'));
  $('#btnClaude').addEventListener('click', () => setTab(UI.tab === 'claude' ? 'project' : 'claude'));
  $$('[data-panel-close]').forEach(b => b.addEventListener('click', () => setTab('project')));
  $$('[data-panel-peek]').forEach(b => b.addEventListener('click', () => { const a = $('#app'); a.classList.toggle('peek'); a.classList.remove('newfiles'); if (a.classList.contains('peek')) { const t = $('#tree'); const n = $('#tree .is-new'); if (n) t.scrollTop = Math.max(0, n.offsetTop - 8); } }));
  $$('[data-peek-close]').forEach(b => b.addEventListener('click', () => $('#app').classList.remove('peek')));

  $('#tree').addEventListener('keydown', e => {
    if (e.key !== 'Enter' && e.key !== ' ') return;
    const r = e.target.closest('.trow'); if (!r) return;
    e.preventDefault(); r.click();
  });
  $$('[data-chips]').forEach(c => c.addEventListener('click', e => { const b = e.target.closest('.chip'); if (b) openFile(b.dataset.p); }));
  $('#etabs').addEventListener('click', e => {

  document.addEventListener('keydown', e => {
    if (e.key !== 'Escape') return;
    if ($('#browser').classList.contains('on')) closeBrowser();
    else ['#openWith', '#spkSheet', '#doneSheet', '#overlayFile'].some(id => { if ($(id).classList.contains('on')) { hide(id); return true; } return false; });
  });
  const onMq = () => { if (isDesk()) hide('#overlayFile'); renderChrome(); };
  if (mq.addEventListener) mq.addEventListener('change', onMq); else if (mq.addListener) mq.addListener(onMq);

  // bàn phím ảo trên điện thoại: thu gọn thanh phụ để đủ chỗ gõ
  if (window.visualViewport) {
    const vv = window.visualViewport, app = $('#app');
    const upd = () => {
      const kb = !isDesk() && (window.innerHeight - vv.height > 120);
      app.classList.toggle('kb', kb);
      if (kb) { document.documentElement.style.setProperty('--vvh', vv.height + 'px'); window.scrollTo(0, 0); }
    };
    vv.addEventListener('resize', upd); vv.addEventListener('scroll', upd);
  }
}

/* ---------- Tạo project và kéo file test case ---------- */
function createProject() {
  const inp = $('#nameIn'); if (!inp) return;
  const v = norm(inp.value);
  if (!/^[A-Za-z0-9._-]{1,40}$/.test(v)) {
    const e = $('#nameErr'); e.textContent = CONFIG.projectCreate.errorText;
    e.classList.remove('on'); void e.offsetWidth; e.classList.add('on'); return;
  }
  S.name = v; applyName(v); save();
  setFlag('project'); renderTree();
}
function addTestcase() {
  if (curStep() !== ST.TC) return;
  applyMilestone('addTestcase'); setFlag('tc');
}
function bindDrag() {
  document.addEventListener('pointerdown', e => {
    const src = e.target.closest('#dragFile');
    if (!src || (e.button && e.button > 0)) return;
    e.preventDefault();
    const sx = e.clientX, sy = e.clientY; let ghost = null, over = false;
    const move = ev => {
      if (!ghost && Math.hypot(ev.clientX - sx, ev.clientY - sy) > 6) {
        ghost = mk('div', 'dragghost', icon('i-file', 'ic-md') + '<span>' + esc(CONFIG.testcaseFileName) + '</span>');
        document.body.appendChild(ghost); src.classList.add('lifted');
      }
      if (ghost) {
        ghost.style.transform = 'translate(' + (ev.clientX - 20) + 'px,' + (ev.clientY - 56) + 'px)';
        const t = document.elementFromPoint(ev.clientX, ev.clientY);
        over = !!(t && t.closest('#tree'));
        $('#tree').classList.toggle('dragover', over);
      }
    };
    const end = ev => {
      window.removeEventListener('pointermove', move); window.removeEventListener('pointerup', end); window.removeEventListener('pointercancel', end);
      $('#tree').classList.remove('dragover'); src.classList.remove('lifted');
      if (ghost) { ghost.remove(); if (over && ev.type === 'pointerup') addTestcase(); }
    };
    window.addEventListener('pointermove', move); window.addEventListener('pointerup', end); window.addEventListener('pointercancel', end);
  });
}

/* ---------- Khởi động ---------- */
applyName(S.name);
bind();
UI.tab = defaultTab();
rebuildAll();

})();

</script>
